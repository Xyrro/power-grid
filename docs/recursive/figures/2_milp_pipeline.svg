<svg xmlns="http://www.w3.org/2000/svg" width="920" height="760" viewBox="0 0 920 760" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="The current best method: the MILP-based pipeline"><title>The current best method: the MILP-based pipeline</title><defs><marker id="h-main" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A4554"/></marker><marker id="h-solver" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C8641E"/></marker><marker id="h-learned" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F6DB5"/></marker><marker id="h-dropped" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9AA3AE"/></marker></defs><rect width="920" height="760" fill="#FFFFFF"/><rect x="210" y="20" width="360" height="56" rx="7" fill="#EEF1F5" stroke="#5B6B7F" stroke-width="1.5"/><text x="390.0" y="44.0" text-anchor="middle" font-size="14" fill="#1F2A37">Instance: load, renewables, reserve</text><text x="390.0" y="62.0" text-anchor="middle" font-size="14" fill="#1F2A37">requirement, initial status</text><rect x="620" y="110" width="280" height="64" rx="7" fill="#FCEBDD" stroke="#C8641E" stroke-width="1.5"/><text x="760.0" y="138.0" text-anchor="middle" font-size="14" fill="#5A2A08">LP relaxation, solved once:</text><text x="760.0" y="156.0" text-anchor="middle" font-size="14" fill="#5A2A08">input, guard and bound</text><rect x="210" y="110" width="360" height="64" rx="7" fill="#E3EDF9" stroke="#2F6DB5" stroke-width="1.5"/><text x="390.0" y="138.0" text-anchor="middle" font-size="14" fill="#14325C">5-member temporal-GNN ensemble,</text><text x="390.0" y="156.0" text-anchor="middle" font-size="14" fill="#14325C">trained on polished labels</text><rect x="210" y="214" width="360" height="64" rx="7" fill="#FFFFFF" stroke="#7A8594" stroke-width="1.5"/><text x="390.0" y="242.0" text-anchor="middle" font-size="14" fill="#1F2A37">Per-generator thresholds, tuned jointly</text><text x="390.0" y="260.0" text-anchor="middle" font-size="14" fill="#1F2A37">on validation (Learning-to-Fix)</text><rect x="210" y="318" width="360" height="64" rx="7" fill="#FFFFFF" stroke="#7A8594" stroke-width="1.5"/><text x="390.0" y="346.0" text-anchor="middle" font-size="14" fill="#1F2A37">Guards release risky fixings:</text><text x="390.0" y="364.0" text-anchor="middle" font-size="14" fill="#1F2A37">adequacy, min up/down, LP relaxation</text><rect x="210" y="422" width="360" height="64" rx="7" fill="#FCEBDD" stroke="#C8641E" stroke-width="1.5"/><text x="390.0" y="450.0" text-anchor="middle" font-size="14" fill="#5A2A08">Reduced MILP at a 0.5 % gap,</text><text x="390.0" y="468.0" text-anchor="middle" font-size="14" fill="#5A2A08">about 89 % of decisions fixed</text><polygon points="390.0,524 510,572.0 390.0,620 270,572.0" fill="#FFFFFF" stroke="#7A8594" stroke-width="1.5"/><text x="390.0" y="568.0" text-anchor="middle" font-size="14" fill="#1F2A37">Bound gap to the</text><text x="390.0" y="586.0" text-anchor="middle" font-size="14" fill="#1F2A37">LP relaxation ≥ 4 %?</text><rect x="20" y="540" width="200" height="64" rx="7" fill="#FCEBDD" stroke="#C8641E" stroke-width="1.5"/><text x="120.0" y="568.0" text-anchor="middle" font-size="14" fill="#5A2A08">Also the full MILP at</text><text x="120.0" y="586.0" text-anchor="middle" font-size="14" fill="#5A2A08">0.5 %; keep the cheaper</text><rect x="210" y="662" width="360" height="56" rx="7" fill="#1F2A37" stroke="#1F2A37" stroke-width="1.5"/><text x="390.0" y="686.0" text-anchor="middle" font-size="14" fill="#FFFFFF">0.30 % mean gap, 97 % served,</text><text x="390.0" y="704.0" text-anchor="middle" font-size="14" fill="#FFFFFF">9.7× mean speed-up (test)</text><path d="M390.0,76.0 L390.0,110.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><path d="M570.0,48.0 L760.0,48.0 L760.0,110.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><path d="M620.0,142.0 L570.0,142.0" fill="none" stroke="#C8641E" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-solver)"/><path d="M390.0,174.0 L390.0,214.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><path d="M390.0,278.0 L390.0,318.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><path d="M390.0,382.0 L390.0,422.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><path d="M390.0,486.0 L390.0,524.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><path d="M732.0,174.0 L732.0,350.0 L570.0,350.0" fill="none" stroke="#C8641E" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-solver)"/><path d="M830.0,174.0 L830.0,572.0 L510.0,572.0" fill="none" stroke="#C8641E" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-solver)"/><path d="M270.0,572.0 L220.0,572.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><text x="262" y="564" text-anchor="end" font-size="12.5" fill="#3A4554" font-style="italic">yes</text><path d="M390.0,620.0 L390.0,662.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><text x="400" y="646" text-anchor="start" font-size="12.5" fill="#3A4554" font-style="italic">no (99 % of test instances)</text><path d="M120.0,604.0 L120.0,690.0 L210.0,690.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><text x="586" y="296" text-anchor="start" font-size="12.5" fill="#3A4554" font-style="italic">never fix a unit-hour</text><text x="586" y="312" text-anchor="start" font-size="12.5" fill="#3A4554" font-style="italic">off that the relaxation</text><text x="586" y="328" text-anchor="start" font-size="12.5" fill="#3A4554" font-style="italic">turns on</text><rect x="20" y="732" width="22" height="14" rx="3" fill="#EEF1F5" stroke="#5B6B7F" stroke-width="1.5"/><text x="50" y="744" font-size="12.5" fill="#3A4554">input / signal</text><rect x="168.39999999999998" y="732" width="22" height="14" rx="3" fill="#E3EDF9" stroke="#2F6DB5" stroke-width="1.5"/><text x="198.39999999999998" y="744" font-size="12.5" fill="#3A4554">learned network</text><rect x="323.4" y="732" width="22" height="14" rx="3" fill="#FFFFFF" stroke="#7A8594" stroke-width="1.5"/><text x="353.4" y="744" font-size="12.5" fill="#3A4554">rule, decoder or repair</text><rect x="531.1999999999999" y="732" width="22" height="14" rx="3" fill="#FCEBDD" stroke="#C8641E" stroke-width="1.5"/><text x="561.1999999999999" y="744" font-size="12.5" fill="#3A4554">LP / MILP solver</text><rect x="692.8" y="732" width="22" height="14" rx="3" fill="#1F2A37" stroke="#1F2A37" stroke-width="1.5"/><text x="722.8" y="744" font-size="12.5" fill="#3A4554">result</text></svg>
