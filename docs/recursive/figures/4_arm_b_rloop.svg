<svg xmlns="http://www.w3.org/2000/svg" width="920" height="900" viewBox="0 0 920 900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="Arm B: recursion with the exact dispatch LP in the loop"><title>Arm B: recursion with the exact dispatch LP in the loop</title><defs><marker id="h-main" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A4554"/></marker><marker id="h-solver" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C8641E"/></marker><marker id="h-learned" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F6DB5"/></marker><marker id="h-dropped" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9AA3AE"/></marker></defs><rect width="920" height="900" fill="#FFFFFF"/><rect x="100" y="20" width="400" height="56" rx="7" fill="#EEF1F5" stroke="#5B6B7F" stroke-width="1.5"/><text x="300.0" y="44.0" text-anchor="middle" font-size="14" fill="#1F2A37">Tokens: unit-hour, bus and line inputs,</text><text x="300.0" y="62.0" text-anchor="middle" font-size="14" fill="#1F2A37">plus the LP relaxation</text><rect x="100" y="116" width="400" height="76" rx="7" fill="#E3EDF9" stroke="#2F6DB5" stroke-width="1.5"/><text x="300.0" y="141.0" text-anchor="middle" font-size="14" fill="#14325C" font-weight="700">Recursive network</text><text x="300.0" y="159.0" text-anchor="middle" font-size="14" fill="#14325C">latent updates, then an answer update;</text><text x="300.0" y="177.0" text-anchor="middle" font-size="14" fill="#14325C">y and z carried between steps</text><rect x="580" y="20" width="320" height="56" rx="7" fill="#E3EDF9" stroke="#2F6DB5" stroke-width="1.5"/><text x="740.0" y="44.0" text-anchor="middle" font-size="14" fill="#14325C">Halting head: stop when the</text><text x="740.0" y="62.0" text-anchor="middle" font-size="14" fill="#14325C">schedule is good enough</text><rect x="100" y="232" width="400" height="56" rx="7" fill="#E3EDF9" stroke="#2F6DB5" stroke-width="1.5"/><text x="300.0" y="256.0" text-anchor="middle" font-size="14" fill="#14325C">Count heads per group of identical</text><text x="300.0" y="274.0" text-anchor="middle" font-size="14" fill="#14325C">units → scores</text><rect x="100" y="328" width="400" height="56" rx="7" fill="#FFFFFF" stroke="#7A8594" stroke-width="1.5"/><text x="300.0" y="352.0" text-anchor="middle" font-size="14" fill="#1F2A37">Viterbi decoding, block adequacy</text><text x="300.0" y="370.0" text-anchor="middle" font-size="14" fill="#1F2A37">and min up/down repairs</text><rect x="100" y="424" width="400" height="56" rx="7" fill="#FCEBDD" stroke="#C8641E" stroke-width="1.5"/><text x="300.0" y="448.0" text-anchor="middle" font-size="14" fill="#5A2A08">Exact dispatch LP</text><text x="300.0" y="466.0" text-anchor="middle" font-size="14" fill="#5A2A08">(warm-started within the instance)</text><rect x="580" y="276" width="320" height="132" rx="7" fill="#EEF1F5" stroke="#5B6B7F" stroke-width="1.5"/><text x="740.0" y="311.0" text-anchor="middle" font-size="14" fill="#1F2A37" font-weight="700">LP feedback</text><text x="740.0" y="329.0" text-anchor="middle" font-size="14" fill="#1F2A37">hourly shed, spill, reserve shortfall;</text><text x="740.0" y="347.0" text-anchor="middle" font-size="14" fill="#1F2A37">bus prices, line loadings, duals;</text><text x="740.0" y="365.0" text-anchor="middle" font-size="14" fill="#1F2A37">unit dispatch, cost sensitivities;</text><text x="740.0" y="383.0" text-anchor="middle" font-size="14" fill="#1F2A37">cost and certified gap</text><rect x="100" y="520" width="400" height="52" rx="7" fill="#FFFFFF" stroke="#7A8594" stroke-width="1.5"/><text x="300.0" y="551.0" text-anchor="middle" font-size="14" fill="#1F2A37">Priced candidate of step k</text><rect x="100" y="612" width="400" height="56" rx="7" fill="#FFFFFF" stroke="#7A8594" stroke-width="1.5"/><text x="300.0" y="636.0" text-anchor="middle" font-size="14" fill="#1F2A37">Keep the cheapest of K steps</text><text x="300.0" y="654.0" text-anchor="middle" font-size="14" fill="#1F2A37">(more steps never hurt)</text><rect x="100" y="708" width="400" height="64" rx="7" fill="#FCEBDD" stroke="#C8641E" stroke-width="1.5"/><text x="300.0" y="736.0" text-anchor="middle" font-size="14" fill="#5A2A08">Safety net: not served, or certified gap</text><text x="300.0" y="754.0" text-anchor="middle" font-size="14" fill="#5A2A08">≥ θ → reduced MILP at 0.5 %</text><rect x="100" y="812" width="400" height="52" rx="7" fill="#1F2A37" stroke="#1F2A37" stroke-width="1.5"/><text x="300.0" y="843.0" text-anchor="middle" font-size="14" fill="#FFFFFF">Schedule and its cost</text><path d="M300.0,76.0 L300.0,116.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><path d="M300.0,192.0 L300.0,232.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><path d="M300.0,288.0 L300.0,328.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><path d="M300.0,384.0 L300.0,424.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><path d="M300.0,480.0 L300.0,520.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><path d="M300.0,572.0 L300.0,612.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><path d="M300.0,668.0 L300.0,708.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><path d="M300.0,772.0 L300.0,812.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><path d="M500.0,131.2 L540.0,131.2 L540.0,48.0 L580.0,48.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><path d="M500.0,452.0 L740.0,452.0 L740.0,408.0" fill="none" stroke="#C8641E" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-solver)"/><path d="M740.0,276.0 L740.0,172.2 L500.0,172.2" fill="none" stroke="#C8641E" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#h-solver)"/><text x="750" y="230" text-anchor="start" font-size="12.5" fill="#3A4554" font-style="italic">next step</text><rect x="580" y="520" width="320" height="170" rx="7" fill="#FBFBF8" stroke="#C9CED6" stroke-width="1.5"/><text x="740.0" y="556.0" text-anchor="middle" font-size="14" fill="#3A4554" font-weight="700">Presets</text><text x="740.0" y="574.0" text-anchor="middle" font-size="14" fill="#3A4554">CPU: 166 k parameters, 2 latent</text><text x="740.0" y="592.0" text-anchor="middle" font-size="14" fill="#3A4554">updates per step, 3 training steps</text><text x="740.0" y="610.0" text-anchor="middle" font-size="14" fill="#3A4554">GPU: hidden 160, 3 latent updates</text><text x="740.0" y="628.0" text-anchor="middle" font-size="14" fill="#3A4554">× 2 cycles, 6 training steps,</text><text x="740.0" y="646.0" text-anchor="middle" font-size="14" fill="#3A4554">then 1,500 REINFORCE updates</text><text x="740.0" y="664.0" text-anchor="middle" font-size="14" fill="#3A4554">Control: every LP signal zeroed</text><rect x="20" y="878" width="22" height="14" rx="3" fill="#EEF1F5" stroke="#5B6B7F" stroke-width="1.5"/><text x="50" y="890" font-size="12.5" fill="#3A4554">input / signal</text><rect x="168.39999999999998" y="878" width="22" height="14" rx="3" fill="#E3EDF9" stroke="#2F6DB5" stroke-width="1.5"/><text x="198.39999999999998" y="890" font-size="12.5" fill="#3A4554">learned network</text><rect x="323.4" y="878" width="22" height="14" rx="3" fill="#FFFFFF" stroke="#7A8594" stroke-width="1.5"/><text x="353.4" y="890" font-size="12.5" fill="#3A4554">rule, decoder or repair</text><rect x="531.1999999999999" y="878" width="22" height="14" rx="3" fill="#FCEBDD" stroke="#C8641E" stroke-width="1.5"/><text x="561.1999999999999" y="890" font-size="12.5" fill="#3A4554">LP / MILP solver</text><rect x="692.8" y="878" width="22" height="14" rx="3" fill="#1F2A37" stroke="#1F2A37" stroke-width="1.5"/><text x="722.8" y="890" font-size="12.5" fill="#3A4554">result</text></svg>
