<svg xmlns="http://www.w3.org/2000/svg" width="920" height="866" viewBox="0 0 920 866" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="The evaluation protocol"><title>The evaluation protocol</title><defs><marker id="h-main" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A4554"/></marker><marker id="h-solver" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C8641E"/></marker><marker id="h-learned" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F6DB5"/></marker><marker id="h-dropped" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9AA3AE"/></marker></defs><rect width="920" height="866" fill="#FFFFFF"/><rect x="160" y="20" width="600" height="56" rx="7" fill="#EEF1F5" stroke="#5B6B7F" stroke-width="1.5"/><text x="460.0" y="44.0" text-anchor="middle" font-size="14" fill="#1F2A37">360 validation instances: model, decoder, thresholds,</text><text x="460.0" y="62.0" text-anchor="middle" font-size="14" fill="#1F2A37">step count K and safety-net threshold chosen here</text><rect x="160" y="112" width="600" height="44" rx="7" fill="#FFFFFF" stroke="#7A8594" stroke-width="1.5"/><text x="460.0" y="139.0" text-anchor="middle" font-size="14" fill="#1F2A37">The selection file is written; the test set is still unread</text><rect x="160" y="192" width="600" height="56" rx="7" fill="#EEF1F5" stroke="#5B6B7F" stroke-width="1.5"/><text x="460.0" y="216.0" text-anchor="middle" font-size="14" fill="#1F2A37">120 test_fresh instances, read once: per instance, one process</text><text x="460.0" y="234.0" text-anchor="middle" font-size="14" fill="#1F2A37">on one core, single-threaded HiGHS and torch</text><rect x="100" y="280" width="720" height="360" rx="10" fill="#F7F9FC" stroke="#9FB3CC" stroke-width="1.2" stroke-dasharray="6 4"/><text x="114" y="302" font-size="13" fill="#2B4A72" font-weight="700">Back to back on the same core: paired timing</text><rect x="160" y="322" width="600" height="52" rx="7" fill="#FCEBDD" stroke="#C8641E" stroke-width="1.5"/><text x="460.0" y="353.0" text-anchor="middle" font-size="14" fill="#5A2A08">Full MILP at 0.1 % (60 s): dual bound DB and time T_MILP</text><rect x="160" y="400" width="600" height="44" rx="7" fill="#FCEBDD" stroke="#C8641E" stroke-width="1.5"/><text x="460.0" y="427.0" text-anchor="middle" font-size="14" fill="#5A2A08">Full MILP at 0.5 %</text><rect x="160" y="470" width="600" height="44" rx="7" fill="#FCEBDD" stroke="#C8641E" stroke-width="1.5"/><text x="460.0" y="497.0" text-anchor="middle" font-size="14" fill="#5A2A08">LP relaxation, re-solved and timed (charged to every method using it)</text><rect x="160" y="540" width="600" height="72" rx="7" fill="#FFFFFF" stroke="#7A8594" stroke-width="1.5"/><text x="460.0" y="563.0" text-anchor="middle" font-size="14" fill="#1F2A37">Learning-free baselines, then the method under test,</text><text x="460.0" y="581.0" text-anchor="middle" font-size="14" fill="#1F2A37">timed with every overhead: features, network passes,</text><text x="460.0" y="599.0" text-anchor="middle" font-size="14" fill="#1F2A37">decoding, repairs, LPs and any MILP fallback</text><rect x="160" y="672" width="600" height="56" rx="7" fill="#FCEBDD" stroke="#C8641E" stroke-width="1.5"/><text x="460.0" y="696.0" text-anchor="middle" font-size="14" fill="#5A2A08">Price every schedule with the exact dispatch LP (shedding</text><text x="460.0" y="714.0" text-anchor="middle" font-size="14" fill="#5A2A08">$10,000/MWh, reserve shortfall $1,000/MWh, inside C)</text><path d="M460.0,76.0 L460.0,112.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><path d="M460.0,156.0 L460.0,192.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><path d="M460.0,248.0 L460.0,322.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><path d="M460.0,374.0 L460.0,400.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><path d="M460.0,444.0 L460.0,470.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><path d="M460.0,514.0 L460.0,540.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><path d="M460.0,612.0 L460.0,672.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><rect x="20" y="772" width="205" height="56" rx="7" fill="#1F2A37" stroke="#1F2A37" stroke-width="1.5"/><text x="122.5" y="796.0" text-anchor="middle" font-size="14" fill="#FFFFFF">Served: no shedding,</text><text x="122.5" y="814.0" text-anchor="middle" font-size="14" fill="#FFFFFF">no reserve shortfall</text><path d="M460.0,728.0 L460.0,750.0 L122.5,750.0 L122.5,772.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><rect x="245" y="772" width="205" height="56" rx="7" fill="#1F2A37" stroke="#1F2A37" stroke-width="1.5"/><text x="347.5" y="796.0" text-anchor="middle" font-size="14" fill="#FFFFFF">Gap (C − DB) / C:</text><text x="347.5" y="814.0" text-anchor="middle" font-size="14" fill="#FFFFFF">mean, median, max</text><path d="M460.0,728.0 L460.0,750.0 L347.5,750.0 L347.5,772.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><rect x="470" y="772" width="205" height="56" rx="7" fill="#1F2A37" stroke="#1F2A37" stroke-width="1.5"/><text x="572.5" y="796.0" text-anchor="middle" font-size="14" fill="#FFFFFF">Speed-up T_MILP / T:</text><text x="572.5" y="814.0" text-anchor="middle" font-size="14" fill="#FFFFFF">mean and geometric</text><path d="M460.0,728.0 L460.0,750.0 L572.5,750.0 L572.5,772.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><rect x="695" y="772" width="205" height="56" rx="7" fill="#1F2A37" stroke="#1F2A37" stroke-width="1.5"/><text x="797.5" y="796.0" text-anchor="middle" font-size="14" fill="#FFFFFF">Paired bootstrap</text><text x="797.5" y="814.0" text-anchor="middle" font-size="14" fill="#FFFFFF">95 % CIs</text><path d="M460.0,728.0 L460.0,750.0 L797.5,750.0 L797.5,772.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><rect x="20" y="842" width="22" height="14" rx="3" fill="#EEF1F5" stroke="#5B6B7F" stroke-width="1.5"/><text x="50" y="854" font-size="12.5" fill="#3A4554">input / signal</text><rect x="168.39999999999998" y="842" width="22" height="14" rx="3" fill="#FFFFFF" stroke="#7A8594" stroke-width="1.5"/><text x="198.39999999999998" y="854" font-size="12.5" fill="#3A4554">rule, decoder or repair</text><rect x="376.19999999999993" y="842" width="22" height="14" rx="3" fill="#FCEBDD" stroke="#C8641E" stroke-width="1.5"/><text x="406.19999999999993" y="854" font-size="12.5" fill="#3A4554">LP / MILP solver</text><rect x="537.8" y="842" width="22" height="14" rx="3" fill="#1F2A37" stroke="#1F2A37" stroke-width="1.5"/><text x="567.8" y="854" font-size="12.5" fill="#3A4554">result</text></svg>
