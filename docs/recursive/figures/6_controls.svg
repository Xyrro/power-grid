<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="The controls: each changes exactly one thing"><title>The controls: each changes exactly one thing</title><defs><marker id="h-main" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A4554"/></marker><marker id="h-solver" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C8641E"/></marker><marker id="h-learned" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F6DB5"/></marker><marker id="h-dropped" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9AA3AE"/></marker></defs><rect width="920" height="470" fill="#FFFFFF"/><rect x="270" y="178" width="380" height="92" rx="7" fill="#E3EDF9" stroke="#2F6DB5" stroke-width="1.5"/><text x="460.0" y="211.0" text-anchor="middle" font-size="14" fill="#14325C" font-weight="700">Main models</text><text x="460.0" y="229.0" text-anchor="middle" font-size="14" fill="#14325C">A: one shared network applied recursively</text><text x="460.0" y="247.0" text-anchor="middle" font-size="14" fill="#14325C">B: the same idea, plus exact LP feedback</text><rect x="20" y="20" width="300" height="64" rx="7" fill="#E3EDF9" stroke="#2F6DB5" stroke-width="1.5"/><text x="170.0" y="48.0" text-anchor="middle" font-size="14" fill="#14325C">A · one-shot: the same network,</text><text x="170.0" y="66.0" text-anchor="middle" font-size="14" fill="#14325C">applied once</text><rect x="600" y="20" width="300" height="64" rx="7" fill="#E3EDF9" stroke="#2F6DB5" stroke-width="1.5"/><text x="750.0" y="48.0" text-anchor="middle" font-size="14" fill="#14325C">A · deep: unshared layers at the</text><text x="750.0" y="66.0" text-anchor="middle" font-size="14" fill="#14325C">same depth, no recursion</text><rect x="20" y="364" width="300" height="64" rx="7" fill="#E3EDF9" stroke="#2F6DB5" stroke-width="1.5"/><text x="170.0" y="392.0" text-anchor="middle" font-size="14" fill="#14325C">A · no LP-relaxation inputs</text><text x="170.0" y="410.0" text-anchor="middle" font-size="14" fill="#14325C">(recursive and one-shot)</text><rect x="600" y="364" width="300" height="64" rx="7" fill="#E3EDF9" stroke="#2F6DB5" stroke-width="1.5"/><text x="750.0" y="392.0" text-anchor="middle" font-size="14" fill="#14325C">B · no feedback: every</text><text x="750.0" y="410.0" text-anchor="middle" font-size="14" fill="#14325C">LP-derived signal zeroed</text><path d="M270.0,205.6 L170.0,205.6 L170.0,84.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><path d="M650.0,205.6 L750.0,205.6 L750.0,84.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><path d="M270.0,242.4 L170.0,242.4 L170.0,364.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><path d="M650.0,242.4 L750.0,242.4 L750.0,364.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><text x="180" y="130" text-anchor="start" font-size="12.5" fill="#3A4554" font-style="italic">remove the recursion</text><text x="740" y="130" text-anchor="end" font-size="12.5" fill="#3A4554" font-style="italic">remove the weight sharing</text><text x="180" y="320" text-anchor="start" font-size="12.5" fill="#3A4554" font-style="italic">remove the LP inputs</text><text x="740" y="320" text-anchor="end" font-size="12.5" fill="#3A4554" font-style="italic">remove the feedback</text><rect x="20" y="446" width="22" height="14" rx="3" fill="#E3EDF9" stroke="#2F6DB5" stroke-width="1.5"/><text x="50" y="458" font-size="12.5" fill="#3A4554">learned network</text></svg>
