<svg xmlns="http://www.w3.org/2000/svg" width="920" height="820" viewBox="0 0 920 820" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="Arm B, CPU round: local search with LP-checked moves ranked by the network"><title>Arm B, CPU round: local search with LP-checked moves ranked by the network</title><defs><marker id="h-main" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A4554"/></marker><marker id="h-solver" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C8641E"/></marker><marker id="h-learned" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F6DB5"/></marker><marker id="h-dropped" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9AA3AE"/></marker></defs><rect width="920" height="820" fill="#FFFFFF"/><rect x="100" y="20" width="400" height="56" rx="7" fill="#FFFFFF" stroke="#7A8594" stroke-width="1.5"/><text x="300.0" y="44.0" text-anchor="middle" font-size="14" fill="#1F2A37">Start: LP rounding and repairs,</text><text x="300.0" y="62.0" text-anchor="middle" font-size="14" fill="#1F2A37">best of 5 LPs</text><rect x="100" y="116" width="400" height="56" rx="7" fill="#FCEBDD" stroke="#C8641E" stroke-width="1.5"/><text x="300.0" y="140.0" text-anchor="middle" font-size="14" fill="#5A2A08">Price the current best: cost and</text><text x="300.0" y="158.0" text-anchor="middle" font-size="14" fill="#5A2A08">exact cost sensitivities (LP duals)</text><rect x="100" y="212" width="400" height="64" rx="7" fill="#FFFFFF" stroke="#7A8594" stroke-width="1.5"/><text x="300.0" y="240.0" text-anchor="middle" font-size="14" fill="#1F2A37">Enumerate block moves: switch a block on</text><text x="300.0" y="258.0" text-anchor="middle" font-size="14" fill="#1F2A37">or off, trim an hour, follow the network</text><rect x="100" y="316" width="400" height="64" rx="7" fill="#FFFFFF" stroke="#7A8594" stroke-width="1.5"/><text x="300.0" y="344.0" text-anchor="middle" font-size="14" fill="#1F2A37">Rank: LP first-order Δcost</text><text x="300.0" y="362.0" text-anchor="middle" font-size="14" fill="#1F2A37">− λ × network log-odds (λ = 0.5)</text><rect x="600" y="316" width="300" height="64" rx="7" fill="#E3EDF9" stroke="#2F6DB5" stroke-width="1.5"/><text x="750.0" y="344.0" text-anchor="middle" font-size="14" fill="#14325C">Recursive network, re-run on</text><text x="750.0" y="362.0" text-anchor="middle" font-size="14" fill="#14325C">the current best’s LP feedback</text><rect x="100" y="420" width="400" height="56" rx="7" fill="#FFFFFF" stroke="#7A8594" stroke-width="1.5"/><text x="300.0" y="444.0" text-anchor="middle" font-size="14" fill="#1F2A37">Apply the best untried move;</text><text x="300.0" y="462.0" text-anchor="middle" font-size="14" fill="#1F2A37">min up/down and adequacy repair</text><rect x="100" y="516" width="400" height="52" rx="7" fill="#FCEBDD" stroke="#C8641E" stroke-width="1.5"/><text x="300.0" y="547.0" text-anchor="middle" font-size="14" fill="#5A2A08">Price it with the dispatch LP</text><polygon points="300.0,600 420,640.0 300.0,680 180,640.0" fill="#FFFFFF" stroke="#7A8594" stroke-width="1.5"/><text x="300.0" y="636.0" text-anchor="middle" font-size="14" fill="#1F2A37">Cheaper than</text><text x="300.0" y="654.0" text-anchor="middle" font-size="14" fill="#1F2A37">the current best?</text><rect x="100" y="712" width="400" height="56" rx="7" fill="#1F2A37" stroke="#1F2A37" stroke-width="1.5"/><text x="300.0" y="736.0" text-anchor="middle" font-size="14" fill="#FFFFFF">After 16 LPs: the best schedule</text><text x="300.0" y="754.0" text-anchor="middle" font-size="14" fill="#FFFFFF">(+ safety net: reduced MILP)</text><path d="M300.0,76.0 L300.0,116.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><path d="M300.0,172.0 L300.0,212.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><path d="M300.0,276.0 L300.0,316.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><path d="M300.0,380.0 L300.0,420.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><path d="M300.0,476.0 L300.0,516.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><path d="M300.0,568.0 L300.0,600.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><path d="M600.0,348.0 L500.0,335.2" fill="none" stroke="#2F6DB5" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-learned)"/><path d="M180.0,640.0 L40.0,640.0 L40.0,144.0 L100.0,144.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><text x="48" y="404" text-anchor="start" font-size="12.5" fill="#3A4554" font-style="italic">yes: accept</text><path d="M420.0,640.0 L540.0,640.0 L540.0,360.8 L500.0,360.8" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><text x="548" y="470" text-anchor="start" font-size="12.5" fill="#3A4554" font-style="italic">no: next move</text><path d="M300.0,680.0 L300.0,712.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><text x="310" y="700" text-anchor="start" font-size="12.5" fill="#3A4554" font-style="italic">16 LPs used: stop</text><rect x="20" y="790" width="22" height="14" rx="3" fill="#E3EDF9" stroke="#2F6DB5" stroke-width="1.5"/><text x="50" y="802" font-size="12.5" fill="#3A4554">learned network</text><rect x="175.0" y="790" width="22" height="14" rx="3" fill="#FFFFFF" stroke="#7A8594" stroke-width="1.5"/><text x="205.0" y="802" font-size="12.5" fill="#3A4554">rule, decoder or repair</text><rect x="382.79999999999995" y="790" width="22" height="14" rx="3" fill="#FCEBDD" stroke="#C8641E" stroke-width="1.5"/><text x="412.79999999999995" y="802" font-size="12.5" fill="#3A4554">LP / MILP solver</text><rect x="544.4" y="790" width="22" height="14" rx="3" fill="#1F2A37" stroke="#1F2A37" stroke-width="1.5"/><text x="574.4" y="802" font-size="12.5" fill="#3A4554">result</text></svg>
