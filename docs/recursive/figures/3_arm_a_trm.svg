<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1080" viewBox="0 0 920 1080" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="Arm A: the TRM-style recursive model and its decoding pipeline"><title>Arm A: the TRM-style recursive model and its decoding pipeline</title><defs><marker id="h-main" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A4554"/></marker><marker id="h-solver" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C8641E"/></marker><marker id="h-learned" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F6DB5"/></marker><marker id="h-dropped" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9AA3AE"/></marker></defs><rect width="920" height="1080" fill="#FFFFFF"/><rect x="120" y="20" width="680" height="56" rx="7" fill="#EEF1F5" stroke="#5B6B7F" stroke-width="1.5"/><text x="460.0" y="44.0" text-anchor="middle" font-size="14" fill="#1F2A37">Input tokens x: one per unit-hour (unit data, hour totals, bus PTDF code),</text><text x="460.0" y="62.0" text-anchor="middle" font-size="14" fill="#1F2A37">plus the LP relaxation</text><rect x="20" y="106" width="880" height="270" rx="10" fill="#F7F9FC" stroke="#9FB3CC" stroke-width="1.2" stroke-dasharray="6 4"/><text x="34" y="128" font-size="13" fill="#2B4A72" font-weight="700">One supervision step, repeated up to N_sup times</text><text x="34" y="145" font-size="13" fill="#2B4A72">(y, z) carried to the next step, detached; loss: BCE on every step’s answer + 0.5 × halting BCE</text><rect x="60" y="160" width="300" height="64" rx="7" fill="#E3EDF9" stroke="#2F6DB5" stroke-width="1.5"/><text x="210.0" y="188.0" text-anchor="middle" font-size="14" fill="#14325C">Latent update, n times:</text><text x="210.0" y="206.0" text-anchor="middle" font-size="14" fill="#14325C">z ← f(x + y + z)</text><rect x="60" y="270" width="300" height="64" rx="7" fill="#E3EDF9" stroke="#2F6DB5" stroke-width="1.5"/><text x="210.0" y="298.0" text-anchor="middle" font-size="14" fill="#14325C">Answer update:</text><text x="210.0" y="316.0" text-anchor="middle" font-size="14" fill="#14325C">y ← f(y + z)</text><rect x="560" y="160" width="310" height="64" rx="7" fill="#E3EDF9" stroke="#2F6DB5" stroke-width="1.5"/><text x="715.0" y="188.0" text-anchor="middle" font-size="14" fill="#14325C">Answer head: one logit</text><text x="715.0" y="206.0" text-anchor="middle" font-size="14" fill="#14325C">per unit-hour</text><rect x="560" y="270" width="310" height="64" rx="7" fill="#E3EDF9" stroke="#2F6DB5" stroke-width="1.5"/><text x="715.0" y="298.0" text-anchor="middle" font-size="14" fill="#14325C">Halting head: stop when at most</text><text x="715.0" y="316.0" text-anchor="middle" font-size="14" fill="#14325C">2 unit-hours are wrong</text><path d="M210.0,224.0 L210.0,270.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><path d="M360.0,289.2 L400.0,289.2 L400.0,192.0 L360.0,192.0" fill="none" stroke="#2F6DB5" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-learned)"/><text x="410" y="226" text-anchor="start" font-size="12.5" fill="#3A4554" font-style="italic">T cycles;</text><text x="410" y="242" text-anchor="start" font-size="12.5" fill="#3A4554" font-style="italic">gradient through</text><text x="410" y="258" text-anchor="start" font-size="12.5" fill="#3A4554" font-style="italic">the last only</text><path d="M360.0,318.0 L530.0,318.0 L530.0,192.0 L560.0,192.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><path d="M530.0,302.0 L560.0,302.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><text x="60" y="362" text-anchor="start" font-size="12.5" fill="#3A4554" font-style="italic">f: one shared 2-layer network (unit, time and graph mixing, SwiGLU)</text><rect x="120" y="410" width="360" height="52" rx="7" fill="#FFFFFF" stroke="#7A8594" stroke-width="1.5"/><text x="300.0" y="441.0" text-anchor="middle" font-size="14" fill="#1F2A37">Probabilities after k steps</text><path d="M300.0,376.0 L300.0,410.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><rect x="120" y="496" width="360" height="52" rx="7" fill="#FFFFFF" stroke="#7A8594" stroke-width="1.5"/><text x="300.0" y="527.0" text-anchor="middle" font-size="14" fill="#1F2A37">Water-filling over identical units</text><rect x="120" y="582" width="360" height="64" rx="7" fill="#FFFFFF" stroke="#7A8594" stroke-width="1.5"/><text x="300.0" y="610.0" text-anchor="middle" font-size="14" fill="#1F2A37">Per-unit Viterbi: min up/down times</text><text x="300.0" y="628.0" text-anchor="middle" font-size="14" fill="#1F2A37">and initial status</text><rect x="120" y="680" width="360" height="52" rx="7" fill="#FFFFFF" stroke="#7A8594" stroke-width="1.5"/><text x="300.0" y="711.0" text-anchor="middle" font-size="14" fill="#1F2A37">Block adequacy repair</text><rect x="120" y="766" width="360" height="52" rx="7" fill="#FCEBDD" stroke="#C8641E" stroke-width="1.5"/><text x="300.0" y="797.0" text-anchor="middle" font-size="14" fill="#5A2A08">Dispatch LP</text><polygon points="300.0,852 420,897.0 300.0,942 180,897.0" fill="#FFFFFF" stroke="#7A8594" stroke-width="1.5"/><text x="300.0" y="893.0" text-anchor="middle" font-size="14" fill="#1F2A37">Sheds load or</text><text x="300.0" y="911.0" text-anchor="middle" font-size="14" fill="#1F2A37">short of reserve?</text><rect x="560" y="865" width="310" height="64" rx="7" fill="#FFFFFF" stroke="#7A8594" stroke-width="1.5"/><text x="715.0" y="893.0" text-anchor="middle" font-size="14" fill="#1F2A37">LP-guided repair: raise the failing</text><text x="715.0" y="911.0" text-anchor="middle" font-size="14" fill="#1F2A37">hours’ reserve (≤ 2 rounds)</text><rect x="120" y="976" width="360" height="64" rx="7" fill="#FFFFFF" stroke="#7A8594" stroke-width="1.5"/><text x="300.0" y="1004.0" text-anchor="middle" font-size="14" fill="#1F2A37">Screen with 4 LP roundings,</text><text x="300.0" y="1022.0" text-anchor="middle" font-size="14" fill="#1F2A37">keep the cheapest</text><path d="M300.0,462.0 L300.0,496.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><path d="M300.0,548.0 L300.0,582.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><path d="M300.0,646.0 L300.0,680.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><path d="M300.0,732.0 L300.0,766.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><path d="M300.0,818.0 L300.0,852.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><path d="M300.0,942.0 L300.0,976.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><path d="M420.0,897.0 L560.0,897.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><text x="436" y="889" text-anchor="start" font-size="12.5" fill="#3A4554" font-style="italic">yes</text><text x="308" y="962" text-anchor="start" font-size="12.5" fill="#3A4554" font-style="italic">no</text><path d="M715.0,865.0 L715.0,792.0 L480.0,792.0" fill="none" stroke="#C8641E" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-solver)"/><text x="724" y="830" text-anchor="start" font-size="12.5" fill="#3A4554" font-style="italic">reprice</text><rect x="560" y="410" width="310" height="152" rx="7" fill="#FBFBF8" stroke="#C9CED6" stroke-width="1.5"/><text x="715.0" y="446.0" text-anchor="middle" font-size="14" fill="#3A4554" font-weight="700">Presets</text><text x="715.0" y="464.0" text-anchor="middle" font-size="14" fill="#3A4554">CPU: hidden 64, n = 4, T = 2,</text><text x="715.0" y="482.0" text-anchor="middle" font-size="14" fill="#3A4554">N_sup = 8 (135 k parameters)</text><text x="715.0" y="500.0" text-anchor="middle" font-size="14" fill="#3A4554">GPU: hidden 128, n = 6, T = 3,</text><text x="715.0" y="518.0" text-anchor="middle" font-size="14" fill="#3A4554">N_sup = 16 (0.63 M parameters)</text><text x="715.0" y="536.0" text-anchor="middle" font-size="14" fill="#3A4554">One step = T × (n + 1) passes of f</text><rect x="560" y="976" width="310" height="64" rx="7" fill="#1F2A37" stroke="#1F2A37" stroke-width="1.5"/><text x="715.0" y="1004.0" text-anchor="middle" font-size="14" fill="#FFFFFF">Schedule and its cost</text><text x="715.0" y="1022.0" text-anchor="middle" font-size="14" fill="#FFFFFF">(headline pipeline)</text><path d="M480.0,1008.0 L560.0,1008.0" fill="none" stroke="#3A4554" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-main)"/><rect x="20" y="1056" width="22" height="14" rx="3" fill="#EEF1F5" stroke="#5B6B7F" stroke-width="1.5"/><text x="50" y="1068" font-size="12.5" fill="#3A4554">input / signal</text><rect x="168.39999999999998" y="1056" width="22" height="14" rx="3" fill="#E3EDF9" stroke="#2F6DB5" stroke-width="1.5"/><text x="198.39999999999998" y="1068" font-size="12.5" fill="#3A4554">learned network</text><rect x="323.4" y="1056" width="22" height="14" rx="3" fill="#FFFFFF" stroke="#7A8594" stroke-width="1.5"/><text x="353.4" y="1068" font-size="12.5" fill="#3A4554">rule, decoder or repair</text><rect x="531.1999999999999" y="1056" width="22" height="14" rx="3" fill="#FCEBDD" stroke="#C8641E" stroke-width="1.5"/><text x="561.1999999999999" y="1068" font-size="12.5" fill="#3A4554">LP / MILP solver</text><rect x="692.8" y="1056" width="22" height="14" rx="3" fill="#1F2A37" stroke="#1F2A37" stroke-width="1.5"/><text x="722.8" y="1068" font-size="12.5" fill="#3A4554">result</text></svg>
